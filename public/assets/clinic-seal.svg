<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <circle cx="100" cy="100" r="92" fill="none" stroke="#0B2545" stroke-width="4" stroke-dasharray="6,3"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#C28200" stroke-width="2"/>
  <circle cx="100" cy="100" r="62" fill="#F8FAFC" stroke="#0B2545" stroke-width="1.5"/>
  
  <!-- Text along path -->
  <path id="sealPathOuter" d="M 15 100 A 85 85 0 1 1 185 100" fill="none"/>
  <path id="sealPathBottom" d="M 185 100 A 85 85 0 0 1 15 100" fill="none"/>
  
  <!-- Caduceus / Rod of Asclepius in center -->
