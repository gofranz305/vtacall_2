    <path d="M 85 135 C 80 120 120 115 115 100 C 110 85 80 80 85 65 C 90 55 105 55 108 60" fill="none" stroke="#0B2545" stroke-width="5" stroke-linecap="round"/>
    <circle cx="108" cy="60" r="3" fill="#0B2545"/>
  </g>
  
  <text font-family="'Times New Roman', serif" font-size="10.5" font-weight="bold" fill="#0B2545" letter-spacing="1">
    <textPath href="#sealPathOuter" startOffset="50%" text-anchor="middle">
      ★ USTP HEALTH &amp; WELLNESS CENTER ★
    </textPath>
  </text>
  <text font-family="'Times New Roman', serif" font-size="9" font-weight="bold" fill="#C28200" letter-spacing="1">
    <textPath href="#sealPathBottom" startOffset="50%" text-anchor="middle">
