<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDB913"/>
      <stop offset="50%" stop-color="#EAA100"/>
      <stop offset="100%" stop-color="#C28200"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2B49"/>
      <stop offset="100%" stop-color="#0B1528"/>
    </linearGradient>
  </defs>

  <!-- Constellation Network Dots -->
  <g stroke="#1A2B49" stroke-width="1.8" opacity="0.85" fill="#1A2B49">
    <!-- Links -->
    <line x1="75" y1="175" x2="130" y2="140"/>
    <line x1="130" y1="140" x2="150" y2="130"/>
    <line x1="150" y1="130" x2="180" y2="100"/>
    <line x1="180" y1="100" x2="210" y2="110"/>
    <line x1="210" y1="110" x2="235" y2="85"/>
    <line x1="235" y1="85" x2="275" y2="60"/>
    <line x1="275" y1="60" x2="260" y2="40"/>
    <line x1="260" y1="40" x2="295" y2="75"/>
    <line x1="295" y1="75" x2="320" y2="115"/>
    <line x1="320" y1="115" x2="310" y2="155"/>
    <line x1="310" y1="155" x2="280" y2="190"/>
    <line x1="280" y1="190" x2="245" y2="200"/>
    <line x1="245" y1="200" x2="210" y2="185"/>
    <line x1="210" y1="185" x2="175" y2="180"/>
    <line x1="175" y1="180" x2="150" y2="130"/>
    <line x1="210" y1="110" x2="245" y2="145"/>
    <line x1="245" y1="145" x2="280" y2="150"/>
    <line x1="245" y1="145" x2="245" y2="200"/>
    <line x1="275" y1="60" x2="305" y2="90"/>
    <line x1="305" y1="90" x2="290" y2="130"/>

    <!-- Nodes -->
    <circle cx="75" cy="175" r="4" fill="#EAA100"/>
    <circle cx="130" cy="140" r="4.5"/>
    <circle cx="150" cy="130" r="4.5"/>
    <circle cx="180" cy="100" r="5"/>
    <circle cx="210" cy="110" r="5"/>
    <circle cx="235" cy="85" r="4.5"/>
    <circle cx="260" cy="40" r="4"/>
    <circle cx="275" cy="60" r="4.5"/>
    <circle cx="295" cy="75" r="4"/>
    <circle cx="305" cy="90" r="4"/>
    <circle cx="320" cy="115" r="4"/>
    <circle cx="310" cy="155" r="4"/>
    <circle cx="290" cy="130" r="4.5"/>
    <circle cx="280" cy="150" r="4.5"/>
    <circle cx="280" cy="190" r="4"/>
    <circle cx="245" cy="200" r="4.5"/>
    <circle cx="245" cy="145" r="5"/>
    <circle cx="210" cy="185" r="4.5"/>
    <circle cx="175" cy="180" r="4.5"/>
  </g>

  <!-- 1927 Small Badge -->
  <text x="73" y="196" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#1A2B49">1927</text>

  <!-- USTP Main Typography -->
  <g id="letters">
    <!-- U -->
    <text x="56" y="248" font-family="'Times New Roman', Georgia, serif" font-size="64" font-weight="900" fill="url(#goldGrad)" stroke="#A36B00" stroke-width="1.2">U</text>
    <!-- S -->
    <text x="120" y="248" font-family="'Times New Roman', Georgia, serif" font-size="64" font-weight="900" fill="url(#goldGrad)" stroke="#A36B00" stroke-width="1.2">S</text>
    <!-- T -->
    <text x="175" y="248" font-family="'Times New Roman', Georgia, serif" font-size="64" font-weight="900" fill="url(#goldGrad)" stroke="#A36B00" stroke-width="1.2">T</text>
    <!-- P -->
    <text x="245" y="248" font-family="'Times New Roman', Georgia, serif" font-size="64" font-weight="900" fill="url(#goldGrad)" stroke="#A36B00" stroke-width="1.2">P</text>
    
    <!-- Vertical 'Southern' alongside the stem of P -->
    <text x="238" y="228" font-family="'Times New Roman', Georgia, serif" font-size="11" font-style="italic" fill="#1A2B49" transform="rotate(-90 238,228)">Southern</text>
  </g>

  <!-- University Subtitles -->
  <text x="200" y="272" font-family="'Arial', 'Helvetica', sans-serif" font-size="10.5" font-weight="bold" letter-spacing="1.5" text-anchor="middle" fill="#1A2B49">UNIVERSITY OF</text>
  <text x="200" y="288" font-family="'Arial', 'Helvetica', sans-serif" font-size="11.5" font-weight="bold" letter-spacing="1.2" text-anchor="middle" fill="#1A2B49">SCIENCE AND TECHNOLOGY</text>
  <text x="200" y="303" font-family="'Arial', 'Helvetica', sans-serif" font-size="9" font-weight="bold" letter-spacing="1.8" text-anchor="middle" fill="#1A2B49">OF SOUTHERN PHILIPPINES</text>
</svg>
